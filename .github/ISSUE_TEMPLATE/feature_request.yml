name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain your workflow or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the feature
      description: Explain what you would like the add-on to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any current workaround?
    validations:
      required: false
